name: ci

# Runs on every push to main and on every pull request targeting main.
# This is the primary quality gate for @pdomain/pdomain-ui.
#
# Jobs:
#   1. lint-check    — read-only Prettier check + ESLint flat config
#   2. typecheck     — tsc --noEmit (strict, exactOptionalPropertyTypes)
#   3. unit-test     — sharded Vitest unit + component tests, excluding
#                      dist/package contract tests
#   4. build-package — Vite build, dist/package contract tests, pack dry-run
#
# Intentionally excluded:
#   - codegen-check: fetches Python wheels from the self-hosted pdomain-index-pip
#     registry (unavailable in GitHub-hosted runners). Run `make codegen-check`
#     locally. The committed src/types/generated/ snapshot is what CI typechecks.
#   - theme-check: sync-design-system.mjs requires the workspace-level
#     ../docs/design-system/ directory, which is outside the pdomain-ui checkout.
#     Run `make theme-check` from the ocr-container workspace locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# ---------------------------------------------------------------------------
# 1. lint-check — Prettier + ESLint
# ---------------------------------------------------------------------------
jobs:
  lint-check:
    name: lint-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint-check
        run: make lint-check

  # ---------------------------------------------------------------------------
  # 2. typecheck — tsc --noEmit
  # ---------------------------------------------------------------------------
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tsc --noEmit
        run: pnpm run typecheck

  # ---------------------------------------------------------------------------
  # 3. unit-test — sharded Vitest unit/component suite
  # ---------------------------------------------------------------------------
  unit-test:
    name: unit-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest shard
        run: pnpm run test:unit --shard=${{ matrix.shard }}

  # ---------------------------------------------------------------------------
  # 4. build-package — Vite build, dist/package contracts, pack dry-run
  # ---------------------------------------------------------------------------
  build-package:
    name: build-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build/package contract tests
        run: pnpm run test:package

      - name: Pack
        run: pnpm pack --pack-destination dist/

      - name: Verify pack contents
        run: |
          TARBALL=$(ls dist/*.tgz)
          echo "Tarball: $TARBALL"
          tar -tzf "$TARBALL" | head -40
          tar -tzf "$TARBALL" | grep -q "dist/index" || { echo "ERROR: dist/index missing from pack"; exit 1; }
          echo "Pack content check passed."

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          retention-days: 1
